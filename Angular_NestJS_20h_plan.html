<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#fff;color:#111;padding:1.5rem;max-width:860px;margin:0 auto}

<body>

<h1>Angular 12 + NestJS — 20 horas</h1>
<div class="sub">GymPro · Digital Harbor Bolivia · Angular desde cero, NestJS CRUD ya conocido</div>

<div class="filters">

<div class="prog-bar"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
<div id="root"></div>

<script>
const blocks=[
  {
    id:'b1',
    label:'Bloque 1',
    title:'Fundamentos de Angular',
    hrs:'Horas 1–5',
    pill:{bg:'#EEEDFE',c:'#26215C'},
    num:{bg:'#CECBF6',c:'#26215C'},
    project:{
      title:'GymPro Clients List — UI estática con componentes reales',
      desc:'Crear el módulo <code>ClientesModule</code> con un <code>ClientesListComponent</code> que muestre una lista de 3 clientes hardcodeados (nombre, email, estado activo). Crear un <code>ClienteCardComponent</code> hijo que recibe un cliente via <code>@Input()</code> y emite un evento <code>@Output() seleccionar</code> al hacer click. Usar <code>*ngFor</code> para renderizar las tarjetas, <code>*ngIf</code> para mostrar el badge "Activo/Inactivo" con color verde/rojo via <code>ngClass</code>. El padre debe mostrar en consola el cliente seleccionado. Criterio de éxito: la lista se renderiza, el badge cambia de color según el estado, y el click en una tarjeta loguea el cliente en consola.'
    }
  },
  {
    id:'b2',
    label:'Bloque 2',
    title:'Routing, Servicios & HttpClient',
    hrs:'Horas 6–10',
    pill:{bg:'#E1F5EE',c:'#04342C'},
    num:{bg:'#9FE1CB',c:'#04342C'},
    project:{
      title:'GymPro Clients — Conectado al Backend NestJS',
      desc:'Conectar el módulo de clientes del Bloque 1 a la API real de GymPro. Crear <code>ClientesService</code> con el método <code>getAll(): Observable&lt;Cliente[]&gt;</code> usando <code>HttpClient</code>. Configurar el proxy de Angular para redirigir <code>/api</code> al NestJS en <code>localhost:3000</code>. En <code>ClientesListComponent</code>, usar el <code>async pipe</code> directamente en el template en lugar de <code>subscribe()</code>. Agregar una variable <code>loading = true</code> que se muestre como spinner mientras cargan los datos, y un bloque <code>*ngIf="error"</code> que muestre el mensaje si el backend no está disponible. Criterio de éxito: la lista muestra datos reales del backend, el spinner aparece durante la carga, y un error de red muestra un mensaje amigable.'
    }
  },
  {
    id:'b3',
    label:'Bloque 3',
    title:'Formularios Reactivos & CRUD Completo',
    hrs:'Horas 11–15',
    pill:{bg:'#FAEEDA',c:'#412402'},
    num:{bg:'#FAC775',c:'#412402'},
    project:{
      title:'CRUD Completo de Clientes con Formularios Reactivos',
      desc:'Implementar el CRUD completo de <code>ClientesModule</code> usando Reactive Forms. El formulario de crear/editar cliente debe tener: <code>nombre</code> (required, minLength 3), <code>email</code> (required, formato email, validador asíncrono que llama a <code>GET /clientes?email=X</code> para verificar unicidad), <code>telefono</code> (pattern de 8 dígitos), <code>fechaNacimiento</code> (Validators.required). Conectar al backend: <code>POST /clientes</code> para crear, <code>PATCH /clientes/:id</code> para editar (mismo formulario, modo diferente), y <code>PATCH /clientes/:id</code> con <code>{activo: false}</code> para eliminación lógica. Mostrar un mensaje de éxito/error via una propiedad <code>toast</code> en el componente. Criterio de éxito: todos los botones funcionan, las validaciones muestran mensajes debajo de cada campo, y los cambios se reflejan en la lista sin recargar la página.'
    }
  },
  {
    id:'b4',
    label:'Bloque 4',
    title:'Auth JWT, Guards & Deploy',
    hrs:'Horas 16–20',
    pill:{bg:'#FAECE7',c:'#4A1B0C'},
    num:{bg:'#F5C4B3',c:'#4A1B0C'},
    project:{
      title:'GymPro Dashboard — Login JWT + Rutas Protegidas + KPIs',
      desc:'Implementar el flujo completo de autenticación para GymPro. Crear <code>LoginComponent</code> con un formulario reactivo que hace <code>POST /auth/login</code> y guarda el <code>accessToken</code> en <code>localStorage</code>. Crear <code>AuthService</code> con un <code>BehaviorSubject&lt;boolean&gt;</code> llamado <code>isLoggedIn$</code> que emite <code>true</code>/<code>false</code> según el token. Crear el <code>AuthInterceptor</code> que adjunta <code>Authorization: Bearer &lt;token&gt;</code> a cada request. Crear <code>AuthGuard</code> que implementa <code>CanActivate</code> y redirige a <code>/login</code> si no hay token. Proteger las rutas <code>/dashboard</code> y <code>/clientes</code> con el guard. En <code>DashboardComponent</code>, consumir <code>GET /dashboard/stats</code> y mostrar 3 KPIs: clientes activos, membresías activas, ventas del mes. Criterio de éxito: sin token, cualquier ruta redirige a login; con token válido, el dashboard muestra los KPIs reales; al cerrar sesión (limpiar localStorage), las rutas vuelven a redirigir.'
    }
  }
];

const hours=[
  {
    b:'b1',
    t:'Angular CLI y estructura del proyecto',
    s:'Crear gymPro-frontend y entender cada archivo',
    why:'Angular CLI es la herramienta que usarás para generar todo en GymPro: módulos, componentes, servicios, guards. Así como tu NestJS tiene una estructura modular por dominio (clientes, membresías, inventario), Angular también organiza la app en módulos — y el CLI te genera esa estructura en segundos. Sin entender la estructura base, cada archivo nuevo va a ser confuso.',
    ex:`<b>Contexto:</b> Empezás desde cero. Abrís la terminal en tu carpeta de proyectos, no existe ningún proyecto Angular todavía.<br><br>
<b>Pasos:</b><br>
1. Instalar Angular CLI versión 12: <code>npm install -g @angular/cli@12</code><br>
2. Crear el proyecto: <code>ng new gymPro-frontend --routing --style=css</code> (cuando pregunte strict mode, elegí <b>Y</b>)<br>
3. Abrir el proyecto: <code>cd gymPro-frontend && code .</code><br>
4. Abrir y leer estos 3 archivos uno por uno: <code>src/app/app.module.ts</code> (módulo raíz — registra todo), <code>src/app/app.component.ts</code> (componente raíz), <code>angular.json</code> (configuración del build)<br>
5. Cambiar el título del app: en <code>app.component.ts</code> cambiar <code>title = 'gymPro-frontend'</code> por <code>title = 'GymPro'</code><br>
6. Correr el servidor: <code>ng serve --open</code><br><br>
<b>Resultado esperado:</b> El browser abre en <code>localhost:4200</code> y muestra "GymPro app is running!" con el logo de Angular. Al cambiar el título, el cambio se refleja sin reiniciar el servidor (hot reload).<br><br>
<b>Reto extra:</b> En <code>app.component.html</code>, borrar todo el contenido generado y poner solo <code>&lt;h1&gt;{{ title }}&lt;/h1&gt;</code>. Entender por qué <code>{{ title }}</code> muestra el valor de la propiedad.`,
    err:'Instalar Angular CLI sin la versión específica (<code>npm install -g @angular/cli</code> sin <code>@12</code>) instala la versión más reciente (v17+) que tiene una estructura completamente distinta — sin NgModules, con standalone components. Todo el material de Angular 12 que tenés no va a coincidir con lo que ves en pantalla.'
  },
  {
    b:'b1',
    t:'Componentes: @Component y templates',
    s:'La unidad básica de la UI — crear ClientesListComponent',
    why:'En Angular, todo lo que se ve en pantalla es un componente. Tu GymPro tendrá decenas: <code>ClientesListComponent</code>, <code>ClienteCardComponent</code>, <code>MembresiaCardComponent</code>, <code>DashboardComponent</code>. Entender cómo funciona un componente — su clase TypeScript, su template HTML y su hoja de estilos — es el 80% de Angular.',
    ex:`<b>Contexto:</b> El proyecto gymPro-frontend ya está creado. Vas a generar el primer componente real para listar clientes.<br><br>
<b>Pasos:</b><br>
1. Generar el módulo de clientes: <code>ng generate module clientes --routing</code><br>
2. Generar el componente dentro del módulo: <code>ng generate component clientes/clientes-list</code><br>
3. Abrir <code>src/app/clientes/clientes-list/clientes-list.component.ts</code> y agregar esta propiedad: <code>clientes = ['Ana Flores', 'Carlos Mamani', 'Lucía Pérez'];</code><br>
4. En el template <code>clientes-list.component.html</code>, reemplazar el contenido por: <code>&lt;h2&gt;Clientes&lt;/h2&gt;&lt;p&gt;Total: {{ clientes.length }}&lt;/p&gt;</code><br>
5. Registrar la ruta en <code>app-routing.module.ts</code>: agregar <code>{ path: 'clientes', component: ClientesListComponent }</code><br>
6. En <code>app.component.html</code>, dejar solo <code>&lt;router-outlet&gt;&lt;/router-outlet&gt;</code> y navegar a <code>localhost:4200/clientes</code><br><br>
<b>Resultado esperado:</b> La ruta <code>/clientes</code> muestra el título "Clientes" y "Total: 3".<br><br>
<b>Reto extra:</b> Agregar una propiedad <code>titulo = 'Lista de Clientes'</code> y usarla en el template con interpolación en lugar del texto hardcodeado.`,
    err:'Generar el componente fuera del módulo correcto (por ejemplo con <code>ng g c clientes-list</code> en lugar de <code>ng g c clientes/clientes-list</code>) lo registra en <code>AppModule</code> en vez de en <code>ClientesModule</code>. El componente funciona, pero la estructura modular queda rota desde el inicio.'
  },
  {
    b:'b1',
    t:'Data Binding: interpolación, property y event',
    s:'Conectar el template con la clase del componente',
    why:'El data binding es cómo Angular sincroniza la lógica TypeScript con lo que el usuario ve y hace. En GymPro, vas a necesitar los tres tipos constantemente: <code>{{ cliente.nombre }}</code> para mostrar datos, <code>[disabled]="loading"</code> para deshabilitar botones mientras carga, y <code>(click)="eliminar(id)"</code> para capturar acciones del usuario.',
    ex:`<b>Contexto:</b> Tenés <code>ClientesListComponent</code> con la lista de strings. Ahora vas a agregar objetos reales y manejar un estado de selección.<br><br>
<b>Pasos:</b><br>
1. En <code>clientes-list.component.ts</code>, reemplazar el array de strings por objetos: <code>clientes = [{id:1, nombre:'Ana Flores', activo:true}, {id:2, nombre:'Carlos Mamani', activo:false}, {id:3, nombre:'Lucía Pérez', activo:true}];</code><br>
2. Agregar la propiedad: <code>clienteSeleccionado: any = null;</code><br>
3. Agregar el método: <code>seleccionar(cliente: any) { this.clienteSeleccionado = cliente; }</code><br>
4. En el template, mostrar la lista con <code>*ngFor</code> (la verás bien en la hora siguiente), y por ahora agregar un botón: <code>&lt;button (click)="seleccionar(clientes[0])"&gt;Ver Ana&lt;/button&gt;</code><br>
5. Debajo del botón mostrar: <code>&lt;p *ngIf="clienteSeleccionado"&gt;Seleccionado: {{ clienteSeleccionado.nombre }}&lt;/p&gt;</code><br>
6. Agregar <code>[disabled]="clienteSeleccionado !== null"</code> al botón para deshabilitarlo si ya hay uno seleccionado<br><br>
<b>Resultado esperado:</b> Al hacer click en "Ver Ana", aparece "Seleccionado: Ana Flores" y el botón se deshabilita.<br><br>
<b>Reto extra:</b> Agregar un botón "Limpiar" que ejecute <code>clienteSeleccionado = null</code> y vuelva a habilitar el primer botón.`,
    err:'Confundir <code>[disabled]="true"</code> (property binding — evalúa la expresión) con <code>disabled="true"</code> (atributo HTML estático — el string "true" es truthy pero si ponés <code>disabled="false"</code> igual deshabilita el botón porque el atributo existe). Este error hace que los botones estén siempre deshabilitados sin importar el estado.'
  },
  {
    b:'b1',
    t:'Directivas: *ngFor, *ngIf, ngClass',
    s:'Renderizar y controlar la UI de la lista de clientes',
    why:'Las directivas estructurales son lo que convierte tu array de clientes en tarjetas en pantalla. <code>*ngFor</code> va a iterar sobre todos los clientes de GymPro, <code>*ngIf</code> va a mostrar el spinner de carga o el mensaje de error, y <code>ngClass</code> va a cambiar el color del badge según el estado de la membresía. Son las herramientas más usadas en cualquier template Angular.',
    ex:`<b>Contexto:</b> <code>ClientesListComponent</code> tiene el array de 3 objetos cliente. Vas a renderizar la lista completa con estilos dinámicos.<br><br>
<b>Pasos:</b><br>
1. En el template, reemplazar el botón por el loop completo:<br>
<code>&lt;div *ngFor="let c of clientes; let i = index"&gt;</code><br>
<code>  &lt;span&gt;{{ i+1 }}. {{ c.nombre }}&lt;/span&gt;</code><br>
<code>  &lt;span [ngClass]="{'badge-activo': c.activo, 'badge-inactivo': !c.activo}"&gt;</code><br>
<code>    {{ c.activo ? 'Activo' : 'Inactivo' }}</code><br>
<code>  &lt;/span&gt;</code><br>
<code>&lt;/div&gt;</code><br>
2. En el archivo CSS del componente, agregar: <code>.badge-activo { background: green; color: white; padding: 2px 8px; border-radius: 99px; }</code> y <code>.badge-inactivo { background: red; color: white; padding: 2px 8px; border-radius: 99px; }</code><br>
3. Agregar una propiedad <code>mostrarInactivos = true</code> y un <code>*ngIf="mostrarInactivos || c.activo"</code> en el div del loop<br>
4. Agregar un botón toggle: <code>&lt;button (click)="mostrarInactivos = !mostrarInactivos"&gt;{{ mostrarInactivos ? 'Ocultar inactivos' : 'Mostrar inactivos' }}&lt;/button&gt;</code><br><br>
<b>Resultado esperado:</b> La lista muestra los 3 clientes con badges de colores. Al hacer click en el botón, Carlos Mamani (inactivo) desaparece y el texto del botón cambia.<br><br>
<b>Reto extra:</b> Usar <code>ngStyle</code> en lugar de <code>ngClass</code> para el badge: <code>[ngStyle]="{'background-color': c.activo ? 'green' : 'red'}"</code>. Entender cuándo preferir uno sobre el otro.`,
    err:'Usar <code>*ngIf</code> y <code>*ngFor</code> en el mismo elemento HTML. Angular no permite dos directivas estructurales en el mismo tag. El error en consola es críptico. La solución es envolver con un <code>&lt;ng-container *ngIf="..."&gt;</code> externo y poner el <code>*ngFor</code> en el elemento hijo.'
  },
  {
    b:'b1',
    t:'@Input y @Output: comunicación padre-hijo',
    s:'Crear ClienteCardComponent reutilizable',
    why:'En GymPro, la UI está organizada en componentes padre-hijo: <code>ClientesListComponent</code> contiene múltiples <code>ClienteCardComponent</code>. El padre pasa el objeto cliente via <code>@Input()</code> y la tarjeta emite eventos (click, editar, eliminar) via <code>@Output()</code>. Este patrón lo vas a usar en absolutamente todos los módulos: membresías, inventario, equipamiento.',
    ex:`<b>Contexto:</b> Tenés la lista funcionando en <code>ClientesListComponent</code>. Ahora vas a extraer cada tarjeta a su propio componente hijo reutilizable.<br><br>
<b>Pasos:</b><br>
1. Generar el componente hijo: <code>ng generate component clientes/cliente-card</code><br>
2. En <code>cliente-card.component.ts</code>, importar <code>Input, Output, EventEmitter</code> desde <code>@angular/core</code><br>
3. Declarar el input: <code>@Input() cliente: {id: number, nombre: string, activo: boolean} = {} as any;</code><br>
4. Declarar el output: <code>@Output() seleccionar = new EventEmitter&lt;number&gt;();</code><br>
5. Agregar método: <code>onSeleccionar() { this.seleccionar.emit(this.cliente.id); }</code><br>
6. En <code>cliente-card.component.html</code>: <code>&lt;div (click)="onSeleccionar()"&gt;{{ cliente.nombre }} — {{ cliente.activo ? 'Activo' : 'Inactivo' }}&lt;/div&gt;</code><br>
7. En <code>ClientesListComponent</code>, reemplazar el <code>*ngFor</code> por: <code>&lt;app-cliente-card *ngFor="let c of clientes" [cliente]="c" (seleccionar)="onSeleccionar($event)"&gt;&lt;/app-cliente-card&gt;</code><br>
8. Agregar en el padre: <code>onSeleccionar(id: number) { console.log('Cliente seleccionado:', id); }</code><br><br>
<b>Resultado esperado:</b> La lista sigue funcionando igual visualmente, pero al clickear cualquier tarjeta, la consola muestra "Cliente seleccionado: 1" (o el id correspondiente).<br><br>
<b>Reto extra:</b> Agregar un segundo <code>@Output() editar = new EventEmitter&lt;number&gt;()</code> y un botón "Editar" dentro de la tarjeta. El padre debe mostrar en consola "Editar cliente: X".`,
    err:'Olvidar registrar <code>ClienteCardComponent</code> en las <code>declarations</code> de <code>ClientesModule</code>. Angular lanza el error "\'app-cliente-card\' is not a known element" que parece un error de typo en el selector pero en realidad es un problema de módulos. Siempre revisar que el componente esté declarado en el módulo correcto.'
  },
  {
    b:'b2',
    t:'Angular Router: rutas y navegación',
    s:'Configurar las rutas principales de GymPro',
    why:'GymPro tiene al menos 8 vistas distintas: login, dashboard, clientes, membresías, inventario, ventas, equipamiento, reportes. El Router de Angular permite navegar entre ellas sin recargar la página, igual que una app móvil. Configurar bien las rutas desde el inicio evita tener que refactorizar toda la estructura después.',
    ex:`<b>Contexto:</b> El proyecto tiene <code>AppRoutingModule</code> con una sola ruta. Vas a estructurar todas las rutas principales de GymPro.<br><br>
<b>Pasos:</b><br>
1. Generar los componentes de página: <code>ng g c pages/dashboard</code>, <code>ng g c pages/login</code>, <code>ng g c pages/not-found</code><br>
2. En <code>app-routing.module.ts</code>, definir las rutas:<br>
<code>const routes: Routes = [</code><br>
<code>  { path: '', redirectTo: '/dashboard', pathMatch: 'full' },</code><br>
<code>  { path: 'login', component: LoginComponent },</code><br>
<code>  { path: 'dashboard', component: DashboardComponent },</code><br>
<code>  { path: 'clientes', loadChildren: () => import('./clientes/clientes.module').then(m => m.ClientesModule) },</code><br>
<code>  { path: '**', component: NotFoundComponent }</code><br>
<code>];</code><br>
3. En <code>app.component.html</code>, agregar una barra de navegación:<br>
<code>&lt;nav&gt;&lt;a routerLink="/dashboard"&gt;Dashboard&lt;/a&gt; | &lt;a routerLink="/clientes"&gt;Clientes&lt;/a&gt;&lt;/nav&gt;</code><br>
<code>&lt;router-outlet&gt;&lt;/router-outlet&gt;</code><br>
4. Importar <code>RouterModule</code> en <code>AppModule</code> si hay errores con <code>routerLink</code><br>
5. Navegar a <code>/clientes/xyz</code> y verificar que aparece <code>NotFoundComponent</code><br><br>
<b>Resultado esperado:</b> La ruta raíz redirige a <code>/dashboard</code>, los links de nav funcionan sin recargar la página, y cualquier ruta desconocida muestra el componente 404.<br><br>
<b>Reto extra:</b> Agregar <code>routerLinkActive="active"</code> a los links de navegación y un estilo <code>.active { font-weight: bold; }</code> para resaltar la ruta actual.`,
    err:'Usar <code>&lt;a href="/clientes"&gt;</code> en lugar de <code>&lt;a routerLink="/clientes"&gt;</code>. El <code>href</code> recarga la página completa y reinicia el estado de la app. El error no lanza ningún warning en consola — simplemente la app se recarga y se pierde todo el estado.'
  },
  {
    b:'b2',
    t:'Rutas con parámetros y ActivatedRoute',
    s:'Ver el detalle de un cliente por su ID',
    why:'En GymPro, al hacer click en un cliente necesitás ir a <code>/clientes/42</code> para ver su perfil completo con sus membresías y plan de entrenamiento. <code>ActivatedRoute</code> te permite leer ese <code>42</code> desde el componente de detalle para pedir los datos al backend. Es el mismo patrón que usarás para membresías, equipamiento y ventas.',
    ex:`<b>Contexto:</b> Tenés el módulo de clientes con lazy loading. Ahora vas a agregar la ruta de detalle y navegación desde la lista.<br><br>
<b>Pasos:</b><br>
1. Generar el componente de detalle: <code>ng g c clientes/cliente-detail</code><br>
2. En <code>clientes-routing.module.ts</code>, agregar las rutas del módulo:<br>
<code>const routes: Routes = [</code><br>
<code>  { path: '', component: ClientesListComponent },</code><br>
<code>  { path: ':id', component: ClienteDetailComponent }</code><br>
<code>];</code><br>
3. En <code>cliente-detail.component.ts</code>, inyectar <code>ActivatedRoute</code>:<br>
<code>constructor(private route: ActivatedRoute) {}</code><br>
4. En <code>ngOnInit()</code>, leer el parámetro: <code>const id = this.route.snapshot.paramMap.get('id'); console.log('ID del cliente:', id);</code><br>
5. Mostrar el ID en el template: <code>&lt;h2&gt;Detalle del cliente ID: {{ clienteId }}&lt;/h2&gt;</code><br>
6. En <code>ClienteCardComponent</code>, agregar navegación al hacer click: inyectar <code>Router</code> y en <code>onSeleccionar()</code> agregar <code>this.router.navigate(['/clientes', this.cliente.id]);</code><br><br>
<b>Resultado esperado:</b> Al hacer click en una tarjeta de cliente, la URL cambia a <code>/clientes/1</code> y el componente de detalle muestra "Detalle del cliente ID: 1".<br><br>
<b>Reto extra:</b> Usar <code>this.route.paramMap.subscribe()</code> en lugar de <code>snapshot</code> para que el componente reaccione si el usuario navega de <code>/clientes/1</code> a <code>/clientes/2</code> sin destruir el componente.`,
    err:'Usar <code>snapshot.paramMap.get(\'id\')</code> cuando el usuario puede navegar entre detalles sin salir del componente (por ejemplo con botones "siguiente/anterior"). El snapshot solo se lee una vez al crear el componente — si la ruta cambia a <code>/clientes/2</code>, el componente no se actualiza. Usar <code>paramMap.subscribe()</code> resuelve esto.'
  },
  {
    b:'b2',
    t:'Servicios e inyección de dependencias',
    s:'Crear ClientesService que encapsula las llamadas HTTP',
    why:'En NestJS ya usás servicios para separar la lógica de negocio de los controllers — Angular hace exactamente lo mismo. <code>ClientesService</code> va a ser el único lugar que sabe cómo llamar a <code>GET /api/clientes</code>. Los componentes solo llaman a <code>clientesService.getAll()</code> sin saber nada de HTTP. Esto te permite cambiar la URL del backend o agregar caché sin tocar ningún componente.',
    ex:`<b>Contexto:</b> Los componentes de clientes tienen los datos hardcodeados. Vas a extraer la lógica de datos a un servicio centralizado.<br><br>
<b>Pasos:</b><br>
1. Generar el servicio: <code>ng generate service clientes/clientes</code><br>
2. En <code>clientes.service.ts</code>, agregar la lista mock por ahora:<br>
<code>private clientes = [{id:1, nombre:'Ana Flores', activo:true}, {id:2, nombre:'Carlos Mamani', activo:false}];</code><br>
3. Agregar el método: <code>getAll() { return this.clientes; }</code><br>
4. Agregar: <code>getById(id: number) { return this.clientes.find(c => c.id === id); }</code><br>
5. En <code>ClientesListComponent</code>, inyectar el servicio en el constructor: <code>constructor(private clientesService: ClientesService) {}</code><br>
6. En <code>ngOnInit()</code>: <code>this.clientes = this.clientesService.getAll();</code><br>
7. En <code>ClienteDetailComponent</code>, inyectar el mismo servicio y usar <code>getById(+id)</code> (el <code>+</code> convierte el string del param a número)<br><br>
<b>Resultado esperado:</b> La lista y el detalle muestran los mismos datos pero ahora vienen del servicio. Si modificás el array en el servicio, todos los componentes se actualizan.<br><br>
<b>Reto extra:</b> Agregar un método <code>add(cliente: any)</code> al servicio y llamarlo desde un botón temporal en la lista. Verificar que el nuevo cliente aparece sin recargar.`,
    err:'Agregar el servicio a <code>providers</code> de un módulo lazy-loaded cuando debería estar en <code>providedIn: \'root\'</code>. Angular crea dos instancias separadas del servicio — una para el módulo raíz y otra para el lazy module. Si guardás datos en una instancia, la otra no los ve. Con <code>providedIn: \'root\'</code> siempre es singleton.'
  },
  {
    b:'b2',
    t:'HttpClient: GET desde la API NestJS de GymPro',
    s:'Reemplazar datos mock por datos reales del backend',
    why:'Tu NestJS ya tiene <code>GET /clientes</code> funcionando. Ahora vas a conectar Angular a ese endpoint real. <code>HttpClient</code> de Angular devuelve <code>Observable&lt;T&gt;</code> — no una Promise — lo que te permite cancelar requests, combinarlos, y manejar estados de carga de forma elegante. Este patrón es idéntico para todos los módulos de GymPro.',
    ex:`<b>Contexto:</b> <code>ClientesService</code> devuelve datos mock. Vas a conectarlo al NestJS real configurando un proxy de desarrollo.<br><br>
<b>Pasos:</b><br>
1. Crear el archivo <code>proxy.conf.json</code> en la raíz del proyecto Angular:<br>
<code>{ "/api": { "target": "http://localhost:3000", "secure": false, "pathRewrite": {"^/api": ""} } }</code><br>
2. En <code>angular.json</code>, agregar bajo <code>serve > options</code>: <code>"proxyConfig": "proxy.conf.json"</code><br>
3. Crear la interfaz del cliente. Nuevo archivo <code>src/app/clientes/cliente.interface.ts</code>:<br>
<code>export interface Cliente { id: number; nombre: string; email: string; activo: boolean; }</code><br>
4. En <code>ClientesService</code>, importar <code>HttpClient</code> e inyectarlo: <code>constructor(private http: HttpClient) {}</code><br>
5. Reemplazar <code>getAll()</code> por: <code>getAll(): Observable&lt;Cliente[]&gt; { return this.http.get&lt;Cliente[]&gt;('/api/clientes'); }</code><br>
6. En <code>AppModule</code>, importar <code>HttpClientModule</code><br>
7. En <code>ClientesListComponent</code>, en <code>ngOnInit()</code>: <code>this.clientesService.getAll().subscribe(data => this.clientes = data);</code><br><br>
<b>Resultado esperado:</b> La lista muestra los clientes reales de la base de datos PostgreSQL. Si agregás un cliente en el backend directamente y recargás, aparece en Angular.<br><br>
<b>Reto extra:</b> Agregar <code>loading = true</code> antes del subscribe y <code>loading = false</code> dentro del callback. Mostrar un spinner en el template con <code>*ngIf="loading"</code>.`,
    err:'Llamar a <code>this.clientesService.getAll()</code> sin hacer <code>.subscribe()</code>. Un Observable es lazy — no ejecuta nada hasta que alguien se suscribe. El request HTTP nunca se envía, la variable <code>clientes</code> queda vacía, y no hay ningún error en consola. Es el error más frustrante de Angular para principiantes.'
  },
  {
    b:'b2',
    t:'async pipe y manejo de errores HTTP',
    s:'La forma idiomática Angular de manejar Observables en templates',
    why:'Hacer <code>subscribe()</code> en el componente y guardar el resultado en una variable funciona, pero crea memory leaks si no hacés el unsubscribe en <code>ngOnDestroy()</code>. El <code>async pipe</code> maneja el ciclo de vida automáticamente y es la forma recomendada en Angular 12. Además, vas a necesitar manejar los errores de red — tu NestJS de GymPro puede estar apagado durante el desarrollo.',
    ex:`<b>Contexto:</b> <code>ClientesListComponent</code> hace subscribe manual. Vas a migrar a async pipe y agregar manejo de errores.<br><br>
<b>Pasos:</b><br>
1. En <code>ClientesListComponent</code>, cambiar la propiedad de <code>clientes: Cliente[] = []</code> a <code>clientes$: Observable&lt;Cliente[]&gt;</code><br>
2. En <code>ngOnInit()</code>, reemplazar el subscribe por: <code>this.clientes$ = this.clientesService.getAll();</code><br>
3. En el template, cambiar el <code>*ngFor</code> a: <code>*ngFor="let c of clientes$ | async"</code><br>
4. Agregar manejo de errores en el servicio con <code>catchError</code>:<br>
<code>import { catchError, of } from 'rxjs';</code><br>
<code>getAll(): Observable&lt;Cliente[]&gt; {</code><br>
<code>  return this.http.get&lt;Cliente[]&gt;('/api/clientes').pipe(</code><br>
<code>    catchError(err => { console.error(err); return of([]); })</code><br>
<code>  );</code><br>
<code>}</code><br>
5. Agregar un estado de error en el componente usando <code>tap</code> y <code>catchError</code> en el Observable antes de asignarlo<br>
6. Apagar el backend NestJS y verificar que la app no crashea — muestra lista vacía<br><br>
<b>Resultado esperado:</b> La lista funciona igual con async pipe, y si el backend no está disponible, muestra una lista vacía en lugar de un error en pantalla.<br><br>
<b>Reto extra:</b> En lugar de devolver <code>of([])</code> en el error, usar un <code>BehaviorSubject&lt;string&gt;</code> llamado <code>error$</code> para emitir el mensaje de error y mostrarlo en el template con <code>{{ error$ | async }}</code>.`,
    err:'Subscribirse a un Observable en el componente con <code>.subscribe()</code> sin implementar <code>ngOnDestroy()</code> con <code>unsubscribe()</code>. Cada vez que el componente se destruye y se recrea (por ejemplo, navegando a otra ruta y volviendo), se acumula una nueva suscripción activa. Con 10 navegaciones tenés 10 requests simultáneos al backend. El async pipe lo evita completamente.'
  },
  {
    b:'b3',
    t:'Reactive Forms: FormBuilder y FormGroup',
    s:'Crear el formulario base para registrar un cliente',
    why:'Template-driven forms (con <code>ngModel</code>) son simples pero difíciles de testear y validar programáticamente. En GymPro, los formularios son complejos: el de cliente tiene validación de email único contra el backend, el de membresía calcula fechas automáticamente, el de venta tiene líneas dinámicas. Reactive Forms te dan control total desde TypeScript — son la elección correcta para un proyecto de esta escala.',
    ex:`<b>Contexto:</b> Vas a crear el formulario de registro de cliente nuevo. El componente <code>ClienteFormComponent</code> aún no existe.<br><br>
<b>Pasos:</b><br>
1. Generar: <code>ng g c clientes/cliente-form</code><br>
2. Importar <code>ReactiveFormsModule</code> en <code>ClientesModule</code><br>
3. En <code>cliente-form.component.ts</code>, inyectar <code>FormBuilder</code> en el constructor<br>
4. Crear el formulario en <code>ngOnInit()</code>:<br>
<code>this.form = this.fb.group({</code><br>
<code>  nombre: [''],</code><br>
<code>  email: [''],</code><br>
<code>  telefono: [''],</code><br>
<code>  activo: [true]</code><br>
<code>});</code><br>
5. En el template, conectar el formulario:<br>
<code>&lt;form [formGroup]="form"&gt;</code><br>
<code>  &lt;input formControlName="nombre" placeholder="Nombre"&gt;</code><br>
<code>  &lt;input formControlName="email" placeholder="Email"&gt;</code><br>
<code>  &lt;button type="button" (click)="onSubmit()"&gt;Guardar&lt;/button&gt;</code><br>
<code>&lt;/form&gt;</code><br>
6. Agregar el método: <code>onSubmit() { console.log(this.form.value); }</code><br>
7. Agregar la ruta <code>/clientes/nuevo</code> que carga <code>ClienteFormComponent</code><br><br>
<b>Resultado esperado:</b> Navegar a <code>/clientes/nuevo</code> muestra el formulario. Al completarlo y hacer click en "Guardar", la consola muestra el objeto <code>{nombre: 'X', email: 'Y', ...}</code>.<br><br>
<b>Reto extra:</b> Agregar <code>console.log(this.form.valid)</code> y verificar que da <code>true</code> sin ningún validador — en la siguiente hora agregaremos las validaciones.`,
    err:'Olvidar importar <code>ReactiveFormsModule</code> en el módulo. Angular lanza el error "Can\'t bind to \'formGroup\' since it isn\'t a known property of \'form\'" que parece un error del DOM pero es un error de módulo. <code>FormsModule</code> (para template-driven) y <code>ReactiveFormsModule</code> son módulos distintos y hay que importar el correcto.'
  },
  {
    b:'b3',
    t:'Validadores síncronos: required, email, pattern',
    s:'Mostrar errores debajo de cada campo del formulario',
    why:'En GymPro, los formularios de clientes tienen reglas estrictas definidas en los criterios de aceptación: nombre obligatorio, email con formato válido, teléfono de 8 dígitos. Angular Validators síncronos verifican estas reglas en el momento en que el usuario tipea, sin necesidad de llamar al backend. Los mensajes de error debajo de cada campo mejoran drásticamente la UX.',
    ex:`<b>Contexto:</b> El formulario de cliente no tiene ninguna validación. Vas a agregar los validadores y los mensajes de error.<br><br>
<b>Pasos:</b><br>
1. Importar <code>Validators</code> desde <code>@angular/forms</code><br>
2. Actualizar el <code>FormGroup</code> con validadores:<br>
<code>nombre: ['', [Validators.required, Validators.minLength(3)]],</code><br>
<code>email: ['', [Validators.required, Validators.email]],</code><br>
<code>telefono: ['', [Validators.pattern(/^\d{8}$/)]]</code><br>
3. Crear un getter helper en el componente: <code>get nombreCtrl() { return this.form.get('nombre'); }</code><br>
4. En el template, agregar mensajes de error debajo del input de nombre:<br>
<code>&lt;div *ngIf="nombreCtrl?.invalid && nombreCtrl?.touched"&gt;</code><br>
<code>  &lt;small *ngIf="nombreCtrl?.errors?.['required']"&gt;El nombre es obligatorio&lt;/small&gt;</code><br>
<code>  &lt;small *ngIf="nombreCtrl?.errors?.['minlength']"&gt;Mínimo 3 caracteres&lt;/small&gt;</code><br>
<code>&lt;/div&gt;</code><br>
5. Repetir el patrón para email y telefono con sus mensajes correspondientes<br>
6. Deshabilitar el botón de guardar: <code>[disabled]="form.invalid"</code><br>
7. En <code>onSubmit()</code>, agregar como primera línea: <code>if (this.form.invalid) { this.form.markAllAsTouched(); return; }</code><br><br>
<b>Resultado esperado:</b> El botón "Guardar" está deshabilitado inicialmente. Al tocar un campo y salir sin llenarlo, aparece el mensaje de error. Si el teléfono no tiene exactamente 8 dígitos, aparece el error de pattern.<br><br>
<b>Reto extra:</b> Agregar un validador personalizado que rechace emails con dominio "@test.com": <code>function noTestEmail(c: AbstractControl) { return c.value?.endsWith('@test.com') ? {testEmail: true} : null; }</code>`,
    err:'Mostrar el error con solo <code>*ngIf="nombreCtrl?.invalid"</code> sin el <code>touched</code>. El formulario muestra todos los errores desde el momento que carga, antes de que el usuario haya interactuado con nada. La UX correcta es mostrar errores solo cuando el usuario tocó y salió del campo (<code>touched</code>) o intentó hacer submit.'
  },
  {
    b:'b3',
    t:'POST y PATCH: crear y editar desde Angular',
    s:'Guardar y actualizar clientes en la base de datos real',
    why:'Ya sabés hacer <code>POST /clientes</code> y <code>PATCH /clientes/:id</code> en NestJS — ahora vas a conectar el formulario de Angular a esos endpoints. El mismo formulario debe servir tanto para crear (sin ID) como para editar (con ID). Este patrón "formulario dual" lo vas a repetir para cada entidad de GymPro: membresías, entrenadores, productos.',
    ex:`<b>Contexto:</b> <code>ClienteFormComponent</code> valida pero aún no guarda en el backend. Vas a conectar el submit al servicio.<br><br>
<b>Pasos:</b><br>
1. En <code>ClientesService</code>, agregar los métodos HTTP:<br>
<code>create(cliente: Partial&lt;Cliente&gt;): Observable&lt;Cliente&gt; { return this.http.post&lt;Cliente&gt;('/api/clientes', cliente); }</code><br>
<code>update(id: number, data: Partial&lt;Cliente&gt;): Observable&lt;Cliente&gt; { return this.http.patch&lt;Cliente&gt;('/api/clientes/'+id, data); }</code><br>
2. En <code>ClienteFormComponent</code>, inyectar <code>ActivatedRoute</code> y <code>ClientesService</code><br>
3. En <code>ngOnInit()</code>, detectar si es edición: <code>const id = this.route.snapshot.paramMap.get('id'); if (id) { this.clientesService.getById(+id).subscribe(c => this.form.patchValue(c)); }</code><br>
4. En <code>onSubmit()</code>, bifurcar según modo:<br>
<code>const id = this.route.snapshot.paramMap.get('id');</code><br>
<code>const op = id ? this.clientesService.update(+id, this.form.value) : this.clientesService.create(this.form.value);</code><br>
<code>op.subscribe({ next: () => this.router.navigate(['/clientes']), error: e => this.errorMsg = e.message });</code><br>
5. Agregar la ruta de edición: <code>{ path: ':id/editar', component: ClienteFormComponent }</code><br>
6. En <code>ClienteCardComponent</code>, el botón "Editar" navega a <code>/clientes/{{ cliente.id }}/editar</code><br><br>
<b>Resultado esperado:</b> Crear un cliente desde el formulario lo guarda en PostgreSQL y redirige a la lista. Hacer click en "Editar" en una tarjeta pre-llena el formulario con los datos actuales y el PATCH actualiza el registro.<br><br>
<b>Reto extra:</b> Usar <code>this.form.reset()</code> al volver a la lista para limpiar el formulario, evitando que si el usuario vuelve a <code>/clientes/nuevo</code> vea los datos del cliente anterior.`,
    err:'Usar <code>setValue()</code> en lugar de <code>patchValue()</code> al pre-llenar el formulario para edición. <code>setValue()</code> requiere que el objeto tenga exactamente los mismos campos que el FormGroup — si el backend devuelve campos extra (como <code>fechaCreacion</code>) lanza un error. <code>patchValue()</code> ignora los campos que no existen en el formulario.'
  },
  {
    b:'b3',
    t:'Eliminación lógica y confirmación modal',
    s:'Desactivar clientes con confirmación del usuario',
    why:'Los criterios de aceptación de GymPro establecen explícitamente que el DELETE debe ser lógico (<code>activo = false</code>) y nunca físico. Pero antes de enviar el PATCH, necesitás pedir confirmación al usuario — nadie quiere desactivar un cliente por accidente. Este patrón de "acción destructiva con confirmación" aparece también en cancelar membresías, dar de baja equipamiento y anular ventas.',
    ex:`<b>Contexto:</b> Las tarjetas de clientes tienen el botón "Editar" funcionando. Vas a agregar el botón "Desactivar" con confirmación.<br><br>
<b>Pasos:</b><br>
1. En <code>ClientesService</code>, agregar: <code>deactivate(id: number): Observable&lt;Cliente&gt; { return this.http.patch&lt;Cliente&gt;('/api/clientes/'+id, {activo: false}); }</code><br>
2. Generar un componente modal de confirmación: <code>ng g c shared/confirm-modal</code><br>
3. En <code>ConfirmModalComponent</code>, declarar: <code>@Input() mensaje = '¿Estás seguro?';</code> y dos <code>@Output()</code>: <code>confirmar = new EventEmitter()</code> y <code>cancelar = new EventEmitter()</code><br>
4. En el template del modal: <code>&lt;div class="modal"&gt;&lt;p&gt;{{ mensaje }}&lt;/p&gt;&lt;button (click)="confirmar.emit()"&gt;Sí&lt;/button&gt;&lt;button (click)="cancelar.emit()"&gt;No&lt;/button&gt;&lt;/div&gt;</code><br>
5. En <code>ClientesListComponent</code>, agregar propiedades: <code>showModal = false; clienteADesactivar: number | null = null;</code><br>

7. Método de confirmación: <code>confirmarDesactivar() { this.clientesService.deactivate(this.clienteADesactivar!).subscribe(() => { this.showModal = false; this.clientes$ = this.clientesService.getAll(); }); }</code><br>
8. En el template, mostrar el modal con <code>*ngIf="showModal"</code><br><br>
<b>Resultado esperado:</b> Al hacer click en "Desactivar", aparece el modal de confirmación. Si el usuario confirma, el cliente se desactiva y la lista se recarga mostrando el badge "Inactivo". Si cancela, nada cambia.<br><br>
<b>Reto extra:</b> Crear un <code>SharedModule</code> y mover <code>ConfirmModalComponent</code> ahí con su <code>exports</code> para que sea reutilizable en los módulos de membresías y equipamiento.`,
    err:'Hacer el request de desactivación directamente sin actualizar la lista después. El backend actualiza el registro pero el <code>Observable</code> <code>clientes$</code> no se vuelve a emitir porque apunta al mismo objeto. Solución: reasignar <code>this.clientes$ = this.clientesService.getAll()</code> en el callback del subscribe para forzar un nuevo request.'
  },
  {
    b:'b3',
    t:'Validador asíncrono: verificar email único',
    s:'Consultar al backend NestJS si el email ya existe',
    why:'Los criterios de aceptación de GymPro (GYM-17) especifican que el email del cliente debe ser único con error descriptivo. Los validadores asíncronos de Angular llaman al backend durante el tipeo y marcan el campo como inválido si la respuesta lo indica. Esto es más robusto que esperar al submit — el usuario sabe que el email está duplicado antes de llenar el resto del formulario.',
    ex:`<b>Contexto:</b> El formulario de cliente valida el formato del email pero no verifica unicidad. Tu NestJS en <code>GET /clientes?email=X</code> devuelve el cliente si existe o un array vacío.<br><br>
<b>Pasos:</b><br>
1. En <code>ClientesService</code>, agregar: <code>checkEmailExists(email: string): Observable&lt;boolean&gt; { return this.http.get&lt;Cliente[]&gt;('/api/clientes?email='+email).pipe(map(result => result.length > 0)); }</code><br>
2. Crear el validador asíncrono como función factory en un archivo nuevo <code>src/app/shared/validators/email-unique.validator.ts</code>:<br>
<code>export function emailUniqueValidator(service: ClientesService): AsyncValidatorFn {</code><br>
<code>  return (control: AbstractControl): Observable&lt;ValidationErrors | null&gt; => {</code><br>
<code>    return service.checkEmailExists(control.value).pipe(</code><br>
<code>      debounceTime(400),</code><br>
<code>      map(exists => exists ? {emailTaken: true} : null)</code><br>
<code>    );</code><br>
<code>  };</code><br>
<code>}</code><br>
3. En <code>ClienteFormComponent</code>, agregar el validador asíncrono al campo email:<br>
<code>email: ['', [Validators.required, Validators.email], [emailUniqueValidator(this.clientesService)]]</code><br>
4. En el template, agregar el mensaje de error: <code>&lt;small *ngIf="emailCtrl?.errors?.['emailTaken']"&gt;Este email ya está registrado&lt;/small&gt;</code><br>
5. Mostrar un estado "verificando..." con <code>*ngIf="emailCtrl?.pending"</code><br><br>
<b>Resultado esperado:</b> Al escribir un email que ya existe en la base de datos, el campo muestra "verificando..." por 400ms y luego "Este email ya está registrado". El botón Guardar permanece deshabilitado.<br><br>
<b>Reto extra:</b> Para el modo edición, el validador no debe disparar si el email pertenece al cliente que estás editando. Pasar el <code>currentId</code> al validador y en el servicio filtrar: <code>result.filter(c => c.id !== currentId).length > 0</code>`,
    err:'Olvidar el <code>debounceTime(400)</code> en el validador asíncrono. Sin él, Angular hace un request al backend con cada tecla presionada — tipear "juan@gmail.com" genera 15 requests simultáneos. Agregar <code>debounceTime(400)</code> espera 400ms de silencio antes de disparar el request.'
  },
  {
    b:'b4',
    t:'Login con JWT: guardar y usar el token',
    s:'Crear LoginComponent que autentica contra NestJS /auth/login',
    why:'Tu NestJS ya tiene el endpoint <code>POST /auth/login</code> implementado (GYM-12) que devuelve <code>{accessToken, refreshToken}</code>. Ahora Angular necesita enviar las credenciales, guardar el token, y redirigir al dashboard. Sin esto, ninguna ruta del backend que requiera JWT va a funcionar desde el frontend.',
    ex:`<b>Contexto:</b> <code>LoginComponent</code> existe pero está vacío. El backend NestJS tiene <code>POST /auth/login</code> funcionando en <code>localhost:3000</code>.<br><br>
<b>Pasos:</b><br>
1. En <code>LoginComponent</code>, crear el formulario reactivo con <code>email</code> y <code>password</code> con validadores <code>required</code><br>
2. Generar el servicio de auth: <code>ng g service auth/auth</code><br>
3. En <code>AuthService</code>, agregar el método de login:<br>
<code>login(email: string, password: string): Observable&lt;{accessToken: string}&gt; {</code><br>
<code>  return this.http.post&lt;{accessToken: string}&gt;('/api/auth/login', {email, password});</code><br>
<code>}</code><br>
4. Agregar los métodos de sesión: <code>saveToken(token: string) { localStorage.setItem('gymPro_token', token); }</code> y <code>getToken(): string | null { return localStorage.getItem('gymPro_token'); }</code> y <code>logout() { localStorage.removeItem('gymPro_token'); }</code><br>
5. En <code>LoginComponent.onSubmit()</code>:<br>
<code>this.authService.login(this.form.value.email, this.form.value.password).subscribe({</code><br>
<code>  next: res => { this.authService.saveToken(res.accessToken); this.router.navigate(['/dashboard']); },</code><br>
<code>  error: () => this.errorMsg = 'Credenciales incorrectas'</code><br>
<code>});</code><br>
6. Mostrar <code>errorMsg</code> en el template con un <code>*ngIf</code><br><br>
<b>Resultado esperado:</b> Al ingresar credenciales válidas del backend NestJS, la app redirige a <code>/dashboard</code>. En DevTools > Application > localStorage aparece la clave <code>gymPro_token</code> con el JWT. Con credenciales incorrectas, aparece "Credenciales incorrectas".<br><br>
<b>Reto extra:</b> Usar <code>sessionStorage</code> en lugar de <code>localStorage</code> y entender la diferencia: <code>sessionStorage</code> se borra al cerrar la pestaña, <code>localStorage</code> persiste. ¿Cuál conviene para GymPro?`,
    err:'Guardar el token JWT en una variable del servicio en lugar de <code>localStorage</code>. Funciona mientras el usuario navega, pero al recargar la página (<code>F5</code>) el servicio se reinicia, la variable queda en <code>null</code>, y el usuario tiene que volver a loguearse aunque su token siga siendo válido. <code>localStorage</code> persiste entre recargas.'
  },
  {
    b:'b4',
    t:'HTTP Interceptor: adjuntar Bearer token',
    s:'Enviar Authorization en cada request automáticamente',
    why:'Sin el interceptor, tendrías que agregar el header <code>Authorization: Bearer X</code> manualmente en cada método de cada servicio — <code>getAll()</code>, <code>create()</code>, <code>update()</code>, etc. El interceptor de Angular intercepta todas las requests salientes y agrega el token automáticamente. Es el equivalente al interceptor de Axios que ya tenés configurado en el criterio de aceptación de GYM-10.',
    ex:`<b>Contexto:</b> El token se guarda correctamente en <code>localStorage</code> pero ningún request al NestJS lo lleva. Los endpoints protegidos devuelven 401.<br><br>
<b>Pasos:</b><br>
1. Generar el interceptor: <code>ng g interceptor auth/auth</code><br>
2. En <code>auth.interceptor.ts</code>, implementar el intercept:<br>
<code>intercept(req: HttpRequest&lt;any&gt;, next: HttpHandler): Observable&lt;HttpEvent&lt;any&gt;&gt; {</code><br>
<code>  const token = localStorage.getItem('gymPro_token');</code><br>
<code>  if (token) {</code><br>
<code>    const authReq = req.clone({ setHeaders: { Authorization: 'Bearer ' + token } });</code><br>
<code>    return next.handle(authReq);</code><br>
<code>  }</code><br>
<code>  return next.handle(req);</code><br>
<code>}</code><br>
3. Registrar el interceptor en <code>AppModule</code> dentro de <code>providers</code>:<br>
<code>{ provide: HTTP_INTERCEPTORS, useClass: AuthInterceptor, multi: true }</code><br>
4. En DevTools > Network, verificar que los requests a <code>/api/clientes</code> incluyen el header <code>Authorization: Bearer eyJ...</code><br>
5. Agregar manejo de 401 en el interceptor: si el response es 401, hacer <code>localStorage.removeItem('gymPro_token')</code> y redirigir a <code>/login</code>:<br>
<code>return next.handle(authReq).pipe(catchError(err => { if (err.status === 401) { localStorage.removeItem('gymPro_token'); this.router.navigate(['/login']); } return throwError(() => err); }));</code><br><br>
<b>Resultado esperado:</b> Todos los requests a <code>/api/*</code> incluyen el Bearer token. Al expirar el token (o si se corrompe), la app redirige automáticamente a <code>/login</code>.<br><br>
<b>Reto extra:</b> Excluir el request de login del interceptor para no adjuntar un token inválido: <code>if (req.url.includes('/auth/login')) return next.handle(req);</code>`,
    err:'Registrar el interceptor sin <code>multi: true</code> en el provider. Angular permite múltiples interceptores en cadena. Sin <code>multi: true</code>, el nuevo interceptor reemplaza al array completo de interceptores en lugar de agregarse. El error no es obvio — simplemente otros interceptores que hayas registrado dejan de funcionar.'
  },
  {
    b:'b4',
    t:'AuthGuard: proteger rutas con CanActivate',
    s:'Redirigir a login si el usuario no está autenticado',
    why:'Sin guards, cualquier usuario puede navegar a <code>/clientes</code> o <code>/dashboard</code> simplemente escribiendo la URL, aunque no esté logueado. El backend rechazará las requests (401), pero la UI mostrará pantallas vacías o errores feos. El <code>AuthGuard</code> evalúa si hay token antes de que el componente cargue y redirige a login si no lo hay.',
    ex:`<b>Contexto:</b> Las rutas <code>/dashboard</code> y <code>/clientes</code> son accesibles sin login. Vas a protegerlas con un guard.<br><br>
<b>Pasos:</b><br>
1. Generar el guard: <code>ng g guard auth/auth</code> (elegir <b>CanActivate</b>)<br>
2. En <code>auth.guard.ts</code>, implementar la lógica:<br>
<code>canActivate(): boolean {</code><br>
<code>  const token = localStorage.getItem('gymPro_token');</code><br>
<code>  if (token) return true;</code><br>
<code>  this.router.navigate(['/login']);</code><br>
<code>  return false;</code><br>
<code>}</code><br>
3. En <code>app-routing.module.ts</code>, proteger las rutas:<br>
<code>{ path: 'dashboard', component: DashboardComponent, canActivate: [AuthGuard] },</code><br>
<code>{ path: 'clientes', loadChildren: ..., canActivate: [AuthGuard] }</code><br>
4. Agregar redirección inversa: en la ruta <code>/login</code>, si ya hay token, redirigir a <code>/dashboard</code> directamente. Crear un <code>NoAuthGuard</code> con la lógica invertida<br>
5. Agregar botón de logout en <code>AppComponent</code>: <code>(click)="logout()"</code> donde <code>logout()</code> llama a <code>authService.logout()</code> y navega a <code>/login</code><br>
6. Probar el flujo completo: cerrar sesión → intentar ir a <code>/clientes</code> → redirige a login → loguearse → accede normalmente<br><br>
<b>Resultado esperado:</b> Sin token, cualquier URL protegida redirige a <code>/login</code>. Con token válido, la navegación funciona normal. Al hacer logout y presionar "atrás" en el browser, redirige a login.<br><br>
<b>Reto extra:</b> Guardar la URL intentada en el guard: <code>this.router.navigate(['/login'], {queryParams: {returnUrl: state.url}})</code>. En <code>LoginComponent</code>, después del login exitoso, leer el <code>returnUrl</code> de los query params y redirigir ahí en lugar de siempre ir a <code>/dashboard</code>.`,
    err:'El guard verifica que el token existe en <code>localStorage</code> pero no verifica si está expirado. Un JWT expirado pasa el guard, llega al backend, recibe 401, el interceptor redirige a login. Esto causa un flash de la vista protegida antes del redirect. La solución correcta es decodificar el JWT en el guard y verificar el campo <code>exp</code>: <code>JSON.parse(atob(token.split(\'.\')[1])).exp > Date.now()/1000</code>'
  },
  {
    b:'b4',
    t:'BehaviorSubject: estado global del usuario',
    s:'Compartir el estado de sesión entre todos los componentes',
    why:'Tu <code>AppComponent</code> necesita saber si hay un usuario logueado para mostrar/ocultar el menú de navegación. <code>DashboardComponent</code> necesita el nombre del usuario para el saludo. Sin estado compartido, cada componente tendría que leer <code>localStorage</code> directamente — código duplicado y difícil de mantener. <code>BehaviorSubject</code> de RxJS es el patrón más simple para estado global en Angular 12 sin necesitar NgRx.',
    ex:`<b>Contexto:</b> El login funciona y el token se guarda, pero los componentes no saben si hay usuario logueado sin leer localStorage manualmente.<br><br>
<b>Pasos:</b><br>
1. En <code>AuthService</code>, agregar el estado reactivo:<br>
<code>private userSubject = new BehaviorSubject&lt;boolean&gt;(!!localStorage.getItem('gymPro_token'));</code><br>
<code>isLoggedIn$ = this.userSubject.asObservable();</code><br>
2. Actualizar el método <code>saveToken()</code>: agregar <code>this.userSubject.next(true);</code><br>
3. Actualizar el método <code>logout()</code>: agregar <code>this.userSubject.next(false);</code><br>
4. En <code>AppComponent</code>, inyectar <code>AuthService</code> y crear: <code>isLoggedIn$ = this.authService.isLoggedIn$;</code><br>
5. En <code>app.component.html</code>, usar async pipe para mostrar/ocultar la barra de navegación:<br>
<code>&lt;nav *ngIf="isLoggedIn$ | async"&gt;&lt;!-- links de navegación --&gt;&lt;/nav&gt;</code><br>
6. Agregar el nombre del usuario: decodificar el payload del JWT en <code>AuthService</code>: <code>getUser(): {email: string, rol: string} | null { const t = localStorage.getItem('gymPro_token'); return t ? JSON.parse(atob(t.split('.')[1])) : null; }</code><br>
7. Mostrar en el header: <code>&lt;span *ngIf="isLoggedIn$ | async"&gt;{{ authService.getUser()?.email }}&lt;/span&gt;</code><br><br>
<b>Resultado esperado:</b> Al loguearse, la barra de navegación aparece instantáneamente sin recargar. Al hacer logout, desaparece. El email del usuario se muestra en el header.<br><br>
<b>Reto extra:</b> Cambiar el <code>BehaviorSubject&lt;boolean&gt;</code> por <code>BehaviorSubject&lt;{email: string, rol: string} | null&gt;</code> para emitir el objeto de usuario completo y eliminar el método <code>getUser()</code>.`,
    err:'Usar un <code>Subject</code> en lugar de un <code>BehaviorSubject</code>. La diferencia crítica: <code>BehaviorSubject</code> emite el último valor inmediatamente al suscribirse — si el usuario ya está logueado cuando <code>AppComponent</code> se inicializa, recibe el estado <code>true</code> de inmediato. Con un <code>Subject</code> normal, los componentes que se suscriben después del login nunca reciben el valor inicial y el menú no aparece.'
  },
  {
    b:'b4',
    t:'Build y deploy: entornos y conexión final',
    s:'Preparar GymPro para producción con Docker',
    why:'El comando <code>ng build</code> genera los archivos estáticos de producción que luego sirve Nginx — exactamente como está definido en el <code>Dockerfile</code> multistage del criterio GYM-31. Los archivos <code>environment.ts</code> y <code>environment.prod.ts</code> permiten que en desarrollo Angular apunte a <code>localhost:3000</code> y en producción a la URL real del backend desplegado en Railway.',
    ex:`<b>Contexto:</b> La app funciona en desarrollo con el proxy. Vas a preparar el build de producción para que funcione con Docker según el criterio GYM-31.<br><br>
<b>Pasos:</b><br>
1. Abrir <code>src/environments/environment.ts</code> y configurar: <code>export const environment = { production: false, apiUrl: 'http://localhost:3000' };</code><br>
2. Abrir <code>src/environments/environment.prod.ts</code>: <code>export const environment = { production: true, apiUrl: '' };</code> (string vacío = URL relativa, Nginx hace el proxy en producción)<br>
3. En <code>ClientesService</code>, reemplazar el string <code>'/api/clientes'</code> por <code>environment.apiUrl + '/clientes'</code>. Repetir en <code>AuthService</code> y todos los demás servicios<br>
4. Crear el <code>Dockerfile</code> del frontend (en la carpeta frontend):<br>
<code>FROM node:16 AS build</code><br>
<code>WORKDIR /app</code><br>
<code>COPY package*.json ./</code><br>
<code>RUN npm ci</code><br>
<code>COPY . .</code><br>
<code>RUN npm run build -- --configuration production</code><br>
<code>FROM nginx:alpine</code><br>
<code>COPY --from=build /app/dist/gymPro-frontend /usr/share/nginx/html</code><br>
<code>EXPOSE 80</code><br>
5. Verificar el build local: <code>ng build --configuration production</code><br>
6. Correr <code>docker-compose up --build</code> desde la raíz del proyecto con el NestJS + Angular + PostgreSQL<br><br>
<b>Resultado esperado:</b> <code>ng build</code> genera la carpeta <code>dist/gymPro-frontend</code> sin errores. <code>docker-compose up --build</code> levanta los 3 servicios y la app es accesible en <code>localhost:80</code> con datos reales del backend.<br><br>
<b>Reto extra:</b> Agregar un <code>nginx.conf</code> personalizado que redirige todas las rutas a <code>index.html</code>: <code>try_files $uri $uri/ /index.html;</code>. Sin esto, recargar la página en <code>/clientes</code> devuelve 404 porque Nginx busca un archivo físico con esa ruta.`,
    err:'No agregar la configuración de <code>try_files</code> en Nginx. El routing de Angular es del lado del cliente — las URLs como <code>/clientes/42</code> no corresponden a archivos físicos. En desarrollo el <code>ng serve</code> maneja esto automáticamente, pero en producción con Nginx, recargar cualquier ruta que no sea <code>/</code> devuelve 404. Es el error más común en el deploy de SPAs.'
  }
];

let done=new Set(),filter='all';

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function toggle(i){
  const b=document.getElementById('bd'+i),c=document.getElementById('cv'+i);
  if(b.classList.contains('open')){b.classList.remove('open');c.textContent='▼';}
  else{b.classList.add('open');c.textContent='▲';}
}
function toggleDone(e,i){
  e.stopPropagation();
  if(done.has(i))done.delete(i);else done.add(i);
  render();
}
function updateProg(){
  const pct=Math.round(done.size/20*100);
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('plbl').textContent=done.size+' de 20 horas completadas';
}
function render(){
  const root=document.getElementById('root');
  root.innerHTML='';
  blocks.forEach(bl=>{
    if(filter!=='all'&&filter!==bl.id)return;
    const bh=document.createElement('div');
    bh.className='block-header';
    bh.innerHTML=`<span class="block-pill" style="background:${bl.pill.bg};color:${bl.pill.c}">${bl.label}</span><span class="block-title">${bl.title}</span><span class="block-hrs">${bl.hrs}</span>`;
    root.appendChild(bh);
    hours.filter(h=>h.b===bl.id).forEach((h,j)=>{
      const i=blocks.findIndex(x=>x.id===bl.id)*5+j;
      const isDone=done.has(i);
      const card=document.createElement('div');
      card.className='card';
      card.innerHTML=`
        <div class="card-head" onclick="toggle(${i})">
          <div class="num" style="background:${bl.num.bg};color:${bl.num.c}">${i+1}</div>
          <div class="title-col">
            <div class="ctitle" style="${isDone?'text-decoration:line-through;opacity:0.45':''}">${h.t}</div>
            <div class="csub">${h.s}</div>
          </div>
          <button class="chk ${isDone?'done':''}" onclick="toggleDone(event,${i})">
            ${isDone?'<span style="color:white;font-size:10px">&#10003;</span>':''}
          </button>
          <span class="chev" id="cv${i}">&#9660;</span>
        </div>
        <div class="body" id="bd${i}">
          <div class="lbl">Por qu&eacute; importa</div>
          <div class="txt">${h.why}</div>
          <div class="lbl">Ejercicio</div>
          <div class="ex-box">${h.ex}</div>
          <div class="lbl">Error com&uacute;n</div>
          <div class="err-box">${h.err}</div>
        </div>`;
      root.appendChild(card);
    });
    const pc=document.createElement('div');
    pc.className='proj-card';
    pc.innerHTML=`<div class="proj-label">Mini-proyecto &mdash; fin de ${bl.label}</div><div class="proj-title">${bl.project.title}</div><div class="proj-desc">${bl.project.desc}</div>`;
    root.appendChild(pc);
  });
  updateProg();
}
render();
</script>
</body>
</html>
